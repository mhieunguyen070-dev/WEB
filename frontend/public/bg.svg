<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf3f7"/>
      <stop offset="0.5" stop-color="#f3e8f8"/>
      <stop offset="1" stop-color="#fbe6ec"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <path id="star" d="M0,-14 Q2,-2 14,0 Q2,2 0,14 Q-2,2 -14,0 Q-2,-2 0,-14 Z"/>
  </defs>

  <!-- Nền gradient nhạt -->
  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- Các vệt sáng mờ -->
  <g filter="url(#blur)">
    <circle cx="180" cy="160" r="260" fill="#e8b7d0" opacity="0.55"/>
    <circle cx="1750" cy="220" r="300" fill="#c9a8e6" opacity="0.45"/>
    <circle cx="1500" cy="920" r="320" fill="#f2a9be" opacity="0.45"/>
    <circle cx="260" cy="900" r="280" fill="#d7b9ee" opacity="0.45"/>
    <circle cx="960" cy="540" r="240" fill="#fde6c9" opacity="0.5"/>
  </g>

  <!-- Vòng tròn mảnh màu vàng kim -->
  <g fill="none" stroke="#d9a066" stroke-opacity="0.22" stroke-width="2">
    <circle cx="1750" cy="220" r="210"/>
    <circle cx="1750" cy="220" r="270"/>
    <circle cx="180" cy="900" r="180"/>
    <circle cx="180" cy="900" r="240"/>
  </g>

  <!-- Ngôi sao lấp lánh -->
  <g fill="#d9a066">
    <use href="#star" transform="translate(240,300) scale(1.2)" opacity="0.45"/>
    <use href="#star" transform="translate(520,130) scale(0.8)" opacity="0.4"/>
    <use href="#star" transform="translate(1180,90) scale(1)" opacity="0.4"/>
    <use href="#star" transform="translate(1620,520) scale(1.3)" opacity="0.4"/>
    <use href="#star" transform="translate(1320,780) scale(0.8)" opacity="0.45"/>
    <use href="#star" transform="translate(700,960) scale(1)" opacity="0.4"/>
    <use href="#star" transform="translate(120,600) scale(0.7)" opacity="0.4"/>
    <use href="#star" transform="translate(1000,300) scale(0.6)" opacity="0.35"/>
  </g>
  <g fill="#b981c8">
    <use href="#star" transform="translate(400,700) scale(0.9)" opacity="0.35"/>
    <use href="#star" transform="translate(1450,300) scale(0.8)" opacity="0.35"/>
    <use href="#star" transform="translate(880,850) scale(0.6)" opacity="0.3"/>
  </g>
</svg>
