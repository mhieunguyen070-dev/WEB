<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a3c"/>
      <stop offset="0.55" stop-color="#5b2a58"/>
      <stop offset="1" stop-color="#b5546f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeccc"/>
      <stop offset="0.5" stop-color="#e9c48a"/>
      <stop offset="1" stop-color="#c98f57"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9e3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9e3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f0bcc9"/>
      <rect width="3" height="12" fill="#e29fb2" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#12061c" flood-opacity="0.45"/>
    </filter>
    <path id="star" d="M0,-14 Q2,-2 14,0 Q2,2 0,14 Q-2,2 -14,0 Q-2,-2 0,-14 Z"/>
  </defs>

  <!-- Nền -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <circle cx="1210" cy="250" r="300" fill="url(#glow)"/>
  <circle cx="1210" cy="250" r="215" fill="none" stroke="#f6dcb0" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="1210" cy="250" r="265" fill="none" stroke="#f6dcb0" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Chữ VENUS -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="130" y="250" font-size="128" letter-spacing="30" fill="url(#gold)" font-weight="700">VENUS</text>
    <text x="136" y="306" font-size="30" letter-spacing="26" fill="#f6dcb0">STORE</text>
    <rect x="136" y="330" width="420" height="2" fill="#f6dcb0" opacity="0.6"/>
    <text x="136" y="378" font-size="27" font-style="italic" fill="#fbe3ea">Tự do thể hiện, tự do tận hưởng.</text>
  </g>

  <!-- Ngôi sao trang trí -->
  <g fill="#fbeccc">
    <use href="#star" transform="translate(722,150) scale(1.3)"/>
    <use href="#star" transform="translate(770,205) scale(0.7)" opacity="0.8"/>
    <use href="#star" transform="translate(1500,110) scale(1)" opacity="0.9"/>
    <use href="#star" transform="translate(1540,400) scale(0.8)" opacity="0.7"/>
    <use href="#star" transform="translate(880,90) scale(0.6)" opacity="0.7"/>
  </g>

  <!-- Áo thun trắng kem -->
  <g transform="translate(935,128) rotate(-5 120 150)" filter="url(#shadow)">
    <!-- móc treo -->
    <path d="M120,-6 L120,-18 Q120,-30 132,-30 Q143,-30 143,-19" fill="none" stroke="#e9c48a" stroke-width="4" stroke-linecap="round"/>
    <path d="M18,44 L120,-6 L222,44" fill="none" stroke="#e9c48a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- thân áo -->
    <path d="M70,0 L100,0 Q120,30 140,0 L170,0 L240,45 L210,100 L180,82 L180,262 Q120,272 60,262 L60,82 L30,100 L0,45 Z" fill="#f8f3ea"/>
    <!-- bóng nhẹ -->
    <path d="M140,0 L170,0 L240,45 L210,100 L180,82 L180,262 Q160,266 140,267 Z" fill="#000" opacity="0.05"/>
    <!-- viền cổ -->
    <path d="M100,0 Q120,30 140,0" fill="none" stroke="#d8cdb8" stroke-width="6" stroke-linecap="round"/>
    <!-- đường may tay -->
    <path d="M60,82 Q54,45 70,0 M180,82 Q186,45 170,0" fill="none" stroke="#d8cdb8" stroke-width="2"/>
    <!-- logo nhỏ -->
    <use href="#star" transform="translate(120,120) scale(1.1)" fill="#c98f57"/>
    <text x="120" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="4" fill="#c98f57">VENUS</text>
  </g>

  <!-- Áo sơ mi sọc hồng -->
  <g transform="translate(1235,120) rotate(5 120 150)" filter="url(#shadow)">
    <!-- móc treo -->
    <path d="M120,-2 L120,-14 Q120,-26 132,-26 Q143,-26 143,-15" fill="none" stroke="#e9c48a" stroke-width="4" stroke-linecap="round"/>
    <path d="M22,50 L120,-2 L218,50" fill="none" stroke="#e9c48a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- thân áo -->
    <path d="M70,10 L100,0 L120,32 L140,0 L170,10 L245,50 L215,105 L182,85 L182,265 Q120,275 58,265 L58,85 L25,105 L-5,50 Z" fill="url(#stripes)"/>
    <path d="M140,0 L170,10 L245,50 L215,105 L182,85 L182,265 Q160,270 140,271 Z" fill="#000" opacity="0.06"/>
    <!-- cổ áo -->
    <path d="M100,0 L120,32 L96,50 L76,14 Z" fill="#fff5f7" stroke="#d98fa5" stroke-width="2" stroke-linejoin="round"/>
    <path d="M140,0 L120,32 L144,50 L164,14 Z" fill="#fff5f7" stroke="#d98fa5" stroke-width="2" stroke-linejoin="round"/>
    <!-- nẹp và cúc -->
    <line x1="120" y1="32" x2="120" y2="268" stroke="#d98fa5" stroke-width="2"/>
    <g fill="#fff5f7" stroke="#c97a92" stroke-width="1.5">
      <circle cx="120" cy="70" r="4.5"/>
      <circle cx="120" cy="110" r="4.5"/>
      <circle cx="120" cy="150" r="4.5"/>
      <circle cx="120" cy="190" r="4.5"/>
      <circle cx="120" cy="230" r="4.5"/>
    </g>
    <!-- túi áo -->
    <path d="M142,105 h32 v36 l-16,8 l-16,-8 z" fill="#f7cdd8" stroke="#d98fa5" stroke-width="1.5"/>
    <!-- đường may tay -->
    <path d="M58,85 Q52,50 70,10 M182,85 Q188,50 170,10" fill="none" stroke="#d98fa5" stroke-width="2"/>
  </g>
</svg>
